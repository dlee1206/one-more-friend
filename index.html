<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One More Friend - Beta</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: white; user-select: none; }
        
        /* 第一幕：模拟 TikTok 界面 */
        #bg-app { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1; background-color: #121212; }
        #bg-app img.bg-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.7; z-index: -1; }
        #bg-app h1 { font-size: 20px; opacity: 0.8; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); z-index: 10; }
        
        /* 悬浮窗：狗狗探头 */
        #dog-peek { position: absolute; bottom: 80px; right: -200px; width: 120px; height: 120px; border-radius: 50%; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.5); transition: right 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; z-index: 100; border: 3px solid #fff; background-color: #333; }
        #dog-peek.show { right: 20px; }
        #dog-peek img { width: 100%; height: 100%; object-fit: cover; }

        /* 全屏遛狗 */
        #screen-walk { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 200; background-color: #000; cursor: pointer; }
        #screen-walk img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        #walk-text { position: absolute; top: 40px; left: 0; width: 100%; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.8); font-weight: bold; pointer-events: none; font-size: 24px; }

        /* 全屏睡觉 */
        #screen-sleep { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 300; background-color: #000; cursor: pointer; }
        #screen-sleep img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        #sleep-text { position: absolute; top: 40%; transform: translateY(-50%); left: 0; width: 100%; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.8); font-weight: bold; pointer-events: none; font-size: 22px; }

        /* 新增：广告小按钮 */
        #ad-btn { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); background-color: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); padding: 8px 16px; border-radius: 20px; font-size: 12px; color: #ccc; display: none; cursor: pointer; z-index: 350; transition: background 0.3s; }
        #ad-btn:hover { background-color: rgba(255,255,255,0.3); }

        /* 新增：假广告播放界面 */
        #screen-ad { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 400; }
        #screen-ad h2 { color: #fff; font-size: 18px; margin-bottom: 10px; }
        #ad-countdown { font-size: 40px; font-weight: bold; color: #ff4d4d; }

        /* 新增：获得玩具界面 */
        #screen-toy { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 350; background-color: #000; cursor: pointer; }
        #screen-toy img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }
        #toy-text { position: absolute; bottom: 50px; left: 0; width: 100%; text-align: center; font-size: 20px; font-weight: bold; text-shadow: 0 2px 4px #000; }

        /* 回到刷手机后的角落图标 */
        #corner-dog { position: absolute; bottom: 20px; left: 20px; width: 50px; height: 50px; border-radius: 50%; overflow: hidden; opacity: 0; transition: opacity 1s ease; z-index: 50; border: 2px solid rgba(255,255,255,0.3); }
        #corner-dog.show { opacity: 1; }
        #corner-dog img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <!-- 第一幕：背景 -->
    <div id="bg-app">
        <img src="bg.jpg" class="bg-img" alt="TikTok Background">
        <h1>你正在刷短视频...</h1>
        <div id="corner-dog"><img src="sleep.jpg" alt="dog"></div>
    </div>

    <!-- 第二幕：探头 -->
    <div id="dog-peek" onclick="startWalk()">
        <img src="peek.jpg" alt="peek dog">
    </div>

    <!-- 第三幕：遛狗 -->
    <div id="screen-walk" onclick="goSleep()">
        <img src="walk.jpg" alt="walk dog">
        <div id="walk-text">🦮 遛狗中...（点击屏幕继续）</div>
    </div>

    <!-- 第四幕：睡觉 + 广告按钮 -->
    <div id="screen-sleep">
        <img src="sleep.jpg" alt="sleep dog">
        <div id="sleep-text">💤 它回家了，你可以继续刷手机</div>
        <div id="ad-btn" onclick="playAd(event)">🎾 看一段短片，给它买个新玩具</div>
    </div>

    <!-- 假广告播放界面 -->
    <div id="screen-ad">
        <h2>广告播放中（测试占位）...</h2>
        <div id="ad-countdown">3</div>
    </div>

    <!-- 第五幕：叼着玩具醒来 -->
    <div id="screen-toy" onclick="endWithToy()">
        <img src="toy.jpg" alt="toy dog">
        <div id="toy-text">✨ 它叼着新玩具睡着了！</div>
    </div>

    <script>
        // 页面加载后，等待3秒，让探头图片滑入
        window.onload = function() {
            setTimeout(() => {
                document.getElementById('dog-peek').classList.add('show');
            }, 3000); 
        };

        // 点击探头的狗，进入遛狗界面
        function startWalk() {
            document.getElementById('dog-peek').classList.remove('show');
            document.getElementById('screen-walk').style.display = 'block';
        }

        // 点击屏幕，进入睡觉界面
        function goSleep() {
            document.getElementById('screen-walk').style.display = 'none';
            document.getElementById('screen-sleep').style.display = 'block';
            
            // 显示广告按钮
            document.getElementById('ad-btn').style.display = 'block';

            // 2.5秒后如果没有点广告，自动结束回到主界面
            window.sleepTimeout = setTimeout(() => {
                document.getElementById('screen-sleep').style.display = 'none';
                document.getElementById('ad-btn').style.display = 'none';
                document.getElementById('corner-dog').classList.add('show');
            }, 2500); 
        }

        // 用户点击看广告
        function playAd(event) {
            event.stopPropagation(); // 阻止点击事件穿透到底部图片
            clearTimeout(window.sleepTimeout); // 取消自动返回
            document.getElementById('ad-btn').style.display = 'none';
            
            // 切换到假广告界面
            document.getElementById('screen-ad').style.display = 'flex';
            
            // 倒计时 3 秒
            let count = 3;
            const timer = setInterval(() => {
                count--;
                document.getElementById('ad-countdown').innerText = count;
                if (count <= 0) {
                    clearInterval(timer);
                    document.getElementById('screen-ad').style.display = 'none';
                    
                    // 广告看完，切换到玩具界面
                    document.getElementById('screen-sleep').style.display = 'none';
                    document.getElementById('screen-toy').style.display = 'block';
                }
            }, 1000);
        }

        // 在玩具界面点击结束
        function endWithToy() {
            document.getElementById('screen-toy').style.display = 'none';
            document.getElementById('corner-dog').classList.add('show');
            // 这里为了让测试者能重新玩，加一个刷新机制
            alert("测试结束！点击确定重新开始。");
            location.reload(); 
        }
    </script>
</body>
</html>
